services:
  portal-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: portal-backend
    restart: unless-stopped
    env_file:
      - ../platform.env
    ports:
      - "${PORTAL_BACKEND_PORT:-3002}:3000"
    environment:
      - PORT=3000
      - KUBECONFIG=/app/.kube/config
      - PIPELINE_ENV_PATH=/app/platform.env
    volumes:
      - portal-data:/app/data
      - ~/.kube:/app/.kube:ro
      - ../platform.env:/app/platform.env:rw
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - portal-net

  portal-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: portal-frontend
    restart: unless-stopped
    env_file:
      - ../platform.env
    ports:
      - "${PORTAL_PORT:-8088}:80"
    depends_on:
      - portal-backend
    networks:
      - portal-net

networks:
  portal-net:
    name: portal-net
    driver: bridge

volumes:
  portal-data:
    name: portal-data
