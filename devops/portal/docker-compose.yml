services:
  portal-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: portal-backend
    restart: unless-stopped
    ports:
      - "${PORTAL_BACKEND_PORT:-3002}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - KUBECONFIG=/app/.kube/config
      - K8S_SERVER_HOST=host.docker.internal
    volumes:
      - portal-data:/app/data
      - ~/.kube/config:/app/.kube/config:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - portal-net

  portal-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: portal-frontend
    restart: unless-stopped
    ports:
      - "${PORTAL_PORT:-8088}:80"
    depends_on:
      - portal-backend
    networks:
      - portal-net

networks:
  portal-net:
    name: portal-net
    driver: bridge

volumes:
  portal-data:
    name: portal-data
