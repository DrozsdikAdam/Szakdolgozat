services:
  portal-db:
    image: postgres:16-alpine
    container_name: portal-db
    restart: unless-stopped
    env_file:
      - ../platform.env
    environment:
      - POSTGRES_DB=${PORTAL_DB_NAME:-portal_db}
      - POSTGRES_USER=${PORTAL_DB_USER:-portal_admin}
      - POSTGRES_PASSWORD=${PORTAL_DB_PASSWORD:-PortalSecurePass2026!}
    volumes:
      - portal-db-data:/var/lib/postgresql/data
    networks:
      - portal-net
  portal-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: portal-backend
    restart: unless-stopped
    env_file:
      - ../platform.env
    ports:
      - "${PORTAL_BACKEND_PORT:-3002}:3000"
    environment:
      - PORT=3000
      - KUBECONFIG=/app/.kube/config
      - PIPELINE_ENV_PATH=/app/platform.env
    volumes:
      - portal-data:/app/data
      - ~/.kube:/app/.kube:ro
      - ../platform.env:/app/platform.env:rw
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - portal-net
    depends_on:
      - portal-db

  portal-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: portal-frontend
    restart: unless-stopped
    env_file:
      - ../platform.env
    ports:
      - "${PORTAL_PORT:-8088}:80"
    depends_on:
      - portal-backend
    networks:
      - portal-net

networks:
  portal-net:
    name: portal-net
    driver: bridge

volumes:
  portal-data:
    name: portal-data
  portal-db-data:
    name: portal-db-data
