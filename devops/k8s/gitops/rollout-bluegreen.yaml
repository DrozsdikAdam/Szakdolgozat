apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: mes-backend-bluegreen
  namespace: app-mes
  labels:
    app.kubernetes.io/name: mes-backend
    app.kubernetes.io/part-of: mes-platform
    strategy: blue-green

spec:
  replicas: 4
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: mes-backend
  template:
    metadata:
      labels:
        app: mes-backend
    spec:
      containers:
        - name: backend
          image: mes-backend:latest
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15

  strategy:
    blueGreen:
      activeService: mes-backend
      previewService: mes-backend-preview
      autoPromotionEnabled: false
      scaleDownDelaySeconds: 30
