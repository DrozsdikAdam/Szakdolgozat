apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: mes-backend-bluegreen
  namespace: app-mes
  labels:
    app.kubernetes.io/name: mes-backend
    app.kubernetes.io/part-of: mes-platform
    strategy: blue-green

spec:
  replicas: 4
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: mes-backend
  template:
    metadata:
      labels:
        app: mes-backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: mes-backend:v16
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          envFrom:
            - secretRef:
                name: backend-secret
          env:
            - name: SPRING_DATA_REDIS_HOST
              value: "host.docker.internal"
            - name: SPRING_DATA_REDIS_PORT
              value: "6379"
            - name: SPRING_MAIL_HOST
              value: "host.docker.internal"
            - name: SPRING_MAIL_PORT
              value: "1025"
            - name: SPRING_JPA_PROPERTIES_HIBERNATE_TYPE_PREFERRED__UUID__JDBC__TYPE
              value: "CHAR"
            - name: SPRING_JPA_PROPERTIES_HIBERNATE_GLOBALLY__QUOTED__IDENTIFIERS
              value: "true"
            - name: JAVA_TOOL_OPTIONS
              value: "-Dspring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=CHAR -Dhibernate.type.preferred_uuid_jdbc_type=CHAR -Dhibernate.auto_quote_keyword=true -Dspring.jpa.properties.hibernate.auto_quote_keyword=true"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 45
            periodSeconds: 15

  strategy:
    blueGreen:
      activeService: mes-backend
      previewService: mes-backend-preview
      autoPromotionEnabled: false
      scaleDownDelaySeconds: 30
