apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: mes-backend-canary
  namespace: app-mes
  labels:
    app.kubernetes.io/name: mes-backend
    app.kubernetes.io/part-of: mes-platform
    strategy: canary

spec:
  replicas: 4
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: mes-backend
  template:
    metadata:
      labels:
        app: mes-backend
    spec:
      containers:
        - name: backend
          image: mes-backend:v13
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          envFrom:
            - secretRef:
                name: backend-secret
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 45
            periodSeconds: 15

  # Lépcsőzetes: 10% -> 25% -> 50% -> 100% forgalomterelés
  strategy:
    canary:
      steps:
        - setWeight: 10
        - pause: { duration: 1m }
        - setWeight: 25
        - pause: { duration: 2m }
        - setWeight: 50
        - pause: { duration: 2m }
        - setWeight: 100
