apiVersion: apps/v1
kind: Deployment
metadata:
  name: haproxy
  namespace: platform-infra
spec:
  replicas: 2
  selector:
    matchLabels:
      app: haproxy
  template:
    metadata:
      labels:
        app: haproxy
    spec:
      containers:
        - name: haproxy
          image: haproxy:alpine
          ports:
            - containerPort: 1433
            - containerPort: 1521
          volumeMounts:
            - name: haproxy-config-volume
              mountPath: /usr/local/etc/haproxy/haproxy.cfg
              subPath: haproxy.cfg
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
      volumes:
        - name: haproxy-config-volume
          configMap:
            name: haproxy-config
