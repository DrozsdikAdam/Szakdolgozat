apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: platform-infra
  labels:
    app: postgres
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/part-of: paas-platform
spec:
  type: ClusterIP
  selector:
    app: postgres
    statefulset.kubernetes.io/pod-name: postgres-0
  ports:
    - port: 5432
      targetPort: 5432
      name: postgresql
