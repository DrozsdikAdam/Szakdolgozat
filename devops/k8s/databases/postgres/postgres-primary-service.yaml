apiVersion: v1
kind: Service
metadata:
  name: postgres-postgresql-primary
  namespace: platform-infra
  labels:
    app.kubernetes.io/component: postgresql
    app.kubernetes.io/instance: postgres
    app.kubernetes.io/name: postgresql-ha
spec:
  type: NodePort
  ports:
    - name: postgresql
      port: 5432
      targetPort: 5432
      nodePort: 30542
  selector:
    app.kubernetes.io/component: postgresql
    app.kubernetes.io/instance: postgres
    app.kubernetes.io/name: postgresql-ha
    statefulset.kubernetes.io/pod-name: postgres-postgresql-ha-postgresql-0
