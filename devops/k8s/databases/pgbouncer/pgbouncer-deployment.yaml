apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgbouncer
  namespace: platform-infra
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pgbouncer
  template:
    metadata:
      labels:
        app: pgbouncer
    spec:
      containers:
        - name: pgbouncer
          image: edoburu/pgbouncer:latest
          ports:
            - containerPort: 5432
          env:
            - name: DB_HOST
              value: "postgres-postgresql-primary"
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              value: "mesuser"
            - name: DB_PASSWORD
              value: "mespassword"
            - name: DB_NAME
              value: "mesdb"
            - name: POOL_MODE
              value: "transaction"
            - name: MAX_CLIENT_CONN
              value: "100"
            - name: AUTH_TYPE
              value: "scram-sha-256"
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
