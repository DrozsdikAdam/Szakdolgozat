apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mssql
  namespace: platform-infra
  labels:
    app: mssql
    app.kubernetes.io/name: mssql
    app.kubernetes.io/part-of: paas-platform
spec:
  serviceName: mssql-headless
  replicas: 1
  selector:
    matchLabels:
      app: mssql
  template:
    metadata:
      labels:
        app: mssql
        app.kubernetes.io/name: mssql
        app.kubernetes.io/part-of: paas-platform
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: mssql
          image: mcr.microsoft.com/mssql/server:2022-latest
          ports:
            - containerPort: 1433
              name: mssql
          env:
            - name: ACCEPT_EULA
              value: "Y"
            - name: MSSQL_PID
              value: "Developer"
            - name: MSSQL_SA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mssql-secret
                  key: MSSQL_SA_PASSWORD
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: mssql-secret
                  key: DB_NAME
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/bash
                  - -c
                  - |
                    for i in {1..60}; do
                      /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -C -Q "IF DB_ID('$DB_NAME') IS NULL CREATE DATABASE $DB_NAME;" && exit 0
                      sleep 2
                    done
                    exit 0
          volumeMounts:
            - name: mssql-data
              mountPath: /var/opt/mssql
          resources:
            requests:
              memory: "1536Mi"
              cpu: "500m"
            limits:
              memory: "2560Mi"
              cpu: "2000m"
  volumeClaimTemplates:
    - metadata:
        name: mssql-data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 5Gi
