apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: platform-infra

generatorOptions:
  disableNameSuffixHash: true

resources:
  - mssql-headless-service.yaml
  - mssql-service.yaml
  - mssql-statefulset.yaml

secretGenerator:
  - name: mssql-secret
    envs:
      - ../../../platform.env
