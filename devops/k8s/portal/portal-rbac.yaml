apiVersion: v1
kind: ServiceAccount
metadata:
  name: paas-portal-sa
  namespace: platform-infra

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: paas-portal-clusterrole
rules:
  - apiGroups: ["", "apps", "autoscaling"]
    resources:
      [
        "pods",
        "pods/log",
        "services",
        "deployments",
        "deployments/scale",
        "horizontalpodautoscalers",
        "configmaps",
        "secrets",
      ]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch", "update", "patch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: paas-portal-binding
roleRef:
  kind: ClusterRole
  name: paas-portal-clusterrole
  apiGroup: rbac.authorization.k8s.io
subjects:
  - kind: ServiceAccount
    name: paas-portal-sa
    namespace: platform-infra
