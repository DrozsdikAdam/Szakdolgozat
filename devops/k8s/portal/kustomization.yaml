apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: platform-infra

generatorOptions:
  disableNameSuffixHash: true

resources:
  - database
  - paas-portal-pvc.yaml
  - portal-ingress.yaml
  - portal-network-policy.yaml
  - portal-rbac.yaml
  - portal-clusterrolebinding.yaml
  - backend/backend-deployment.yaml
  - backend/backend-service.yaml
  - frontend/frontend-deployment.yaml
  - frontend/frontend-service.yaml

secretGenerator:
  - name: paas-portal-auth
    envs:
      - ../../platform.env
  - name: portal-db-secret
    envs:
      - ../../platform.env
