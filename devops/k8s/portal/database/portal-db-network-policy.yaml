apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: portal-db-network-policy
  namespace: platform-infra
  labels:
    app.kubernetes.io/name: portal-db
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: paas-platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: portal-db
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: ["paas-portal", "portal-backend"]
      ports:
        - port: 5432
          protocol: TCP
