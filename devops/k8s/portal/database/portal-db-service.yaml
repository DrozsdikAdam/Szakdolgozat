apiVersion: v1
kind: Service
metadata:
  name: portal-db
  namespace: platform-infra
  labels:
    app.kubernetes.io/name: portal-db
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: paas-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: portal-db
  ports:
    - name: postgresql
      port: 5432
      targetPort: 5432
      protocol: TCP
