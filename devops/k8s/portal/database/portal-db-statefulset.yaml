apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: portal-db
  namespace: platform-infra
  labels:
    app.kubernetes.io/name: portal-db
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: paas-platform
    app: portal-db
spec:
  serviceName: portal-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: portal-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: portal-db
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: paas-platform
        app: portal-db
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
              name: postgresql
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: portal-db-secret
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: portal-db-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: portal-db-secret
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: portal-db-storage
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - exec pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - exec pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
      volumes:
        - name: portal-db-storage
          persistentVolumeClaim:
            claimName: portal-db-pvc
