  name: paas-portal-auth
  namespace: platform-infra
  labels:
    app.kubernetes.io/name: paas-portal
    app.kubernetes.io/part-of: paas-platform
type: Opaque
stringData:
  username: admin
  passwordHash: "${PORTAL_ADMIN_PASSWORD_HASH}"
  auth: |
    admin:${PORTAL_ADMIN_PASSWORD_HASH}
