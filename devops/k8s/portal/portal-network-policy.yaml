apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: paas-portal-network-policy
  namespace: platform-infra
spec:
  podSelector:
    matchLabels:
      app: paas-portal
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 3000
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - ports:
        - port: 443
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: platform-monitoring
      ports:
        - port: 9090
          protocol: TCP
