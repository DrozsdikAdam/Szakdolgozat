apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal-frontend
  namespace: platform-infra
  labels:
    app: portal-frontend
    app.kubernetes.io/name: portal-frontend
    app.kubernetes.io/part-of: paas-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: portal-frontend
  template:
    metadata:
      labels:
        app: portal-frontend
        app.kubernetes.io/name: portal-frontend
        app.kubernetes.io/part-of: paas-platform
    spec:
      containers:
        - name: portal-frontend
          image: portal-frontend:v5
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          ports:
            - containerPort: 80
              name: http
