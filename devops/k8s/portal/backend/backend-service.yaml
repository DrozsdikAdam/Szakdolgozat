apiVersion: v1
kind: Service
metadata:
  name: portal-backend
  namespace: platform-infra
  labels:
    app: portal-backend
    app.kubernetes.io/name: portal-backend
    app.kubernetes.io/part-of: paas-platform
spec:
  type: ClusterIP
  selector:
    app: portal-backend
  ports:
    - port: 3000
      name: http
      targetPort: 3000
      protocol: TCP
