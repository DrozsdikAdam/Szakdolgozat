apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-network-policy
spec:
  podSelector:
    matchLabels:
      app: mes-backend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - port: 8080
          protocol: TCP

  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: platform-infra
      ports:
        - port: 5432
          protocol: TCP
        - port: 6379
          protocol: TCP
        - port: 1433
          protocol: TCP
        - port: 1521
          protocol: TCP
        - port: 9000
          protocol: TCP
    - ports:
        - port: 5432
          protocol: TCP
        - port: 6543
          protocol: TCP
        - port: 6379
          protocol: TCP
        - port: 1025
          protocol: TCP
