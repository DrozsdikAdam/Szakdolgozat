apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: mes-backend-vpa
spec:
  targetRef:
    apiVersion: "apps/v1"
    kind: Deployment
    name: mes-backend
  updatePolicy:
    # "Auto": Automatically evicts and resizes pods based on usage
    # "Off": Recommendation mode only (calculates optimal CPU/memory without restarting pods)
    updateMode: "Auto"
  resourcePolicy:
    containerPolicies:
      - containerName: "backend"
        minAllowed:
          cpu: "100m"
          memory: "256Mi"
        maxAllowed:
          cpu: "1000m"
          memory: "1Gi"
        controlledResources: ["cpu", "memory"]
