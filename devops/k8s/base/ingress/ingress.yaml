apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mes-ingress
  labels:
    app.kubernetes.io/name: mes-ingress
  annotations:
    cert-manager.io/cluster-issuer: "selfsigned-issuer"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/limit-rps: "20"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - mes.localhost
      secretName: mes-tls-secret
  rules:
    - host: mes.localhost
      http:
        paths:
          - pathType: Prefix
            path: "/api"
            backend:
              service:
                name: mes-backend
                port:
                  number: 8080
          - pathType: Prefix
            path: "/"
            backend:
              service:
                name: mes-frontend
                port:
                  number: 80
