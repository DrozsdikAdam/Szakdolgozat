apiVersion: v1
kind: Secret
metadata:
  name: mes-tls-secret
  labels:
    app.kubernetes.io/name: mes-ingress
    app.kubernetes.io/part-of: mes-platform
type: kubernetes.io/tls
stringData:
  tls.crt: |
    -----BEGIN CERTIFICATE-----
    # PEM formátumú X.509 tanúsítvány (Cert-Manager vagy Let's Encrypt által kiállítva)
    ${TLS_CERTIFICATE_PEM}
    -----END CERTIFICATE-----
  tls.key: |
    -----BEGIN RSA PRIVATE KEY-----
    # PEM formátumú privát kulcs (bizalmas, soha nem kerül Gitbe!)
    ${TLS_PRIVATE_KEY_PEM}
    -----END RSA PRIVATE KEY-----
