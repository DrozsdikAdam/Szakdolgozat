apiVersion: v1
kind: Service
metadata:
  name: paas-resilience-proxy
  namespace: platform-infra
  labels:
    app: resilience-proxy
    app.kubernetes.io/part-of: paas-resilience
spec:
  type: NodePort
  selector:
    app: resilience-proxy
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30880
      protocol: TCP
