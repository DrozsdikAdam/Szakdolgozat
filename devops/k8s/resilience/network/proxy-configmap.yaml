apiVersion: v1
kind: ConfigMap
metadata:
  name: network-proxy-config
  namespace: platform-infra
  labels:
    app: resilience-proxy
    app.kubernetes.io/part-of: paas-resilience
data:
  nginx.conf: |
    server {
        listen 8080;
        server_name _;

        # 1. Kubernetes Health Check
        location /healthz {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        # 2. Normál átjáró (Transzparens proxy a backendhez)
        location /proxy/normal/ {
            proxy_pass http://paas-portal-backend.platform-infra.svc.cluster.local:3000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }

        # 3. Mesterséges hálózati lassítás / késleltetés
        location /proxy/latency/ {
            proxy_pass http://paas-portal-backend.platform-infra.svc.cluster.local:3000/;
            proxy_buffering off;
            limit_rate 2k;
            proxy_set_header Host $host;
        }

        # 4. Hiba-injektálás: HTTP 500 (Circuit Breaker teszteléshez)
        location /proxy/fault/ {
            return 500 '{"error":"Injected Chaos Fault","status":500,"type":"chaos-500"}\n';
            add_header Content-Type application/json;
        }

        # 5. Kiesés-injektálás: HTTP 503 (Service Unavailable)
        location /proxy/unavailable/ {
            return 503 '{"error":"Service Temporarily Unavailable (Chaos Test)","status":503,"type":"chaos-503"}\n';
            add_header Content-Type application/json;
        }
    }
