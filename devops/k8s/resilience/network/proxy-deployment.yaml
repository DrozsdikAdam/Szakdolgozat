apiVersion: apps/v1
kind: Deployment
metadata:
  name: paas-resilience-proxy
  namespace: platform-infra
  labels:
    app: resilience-proxy
    app.kubernetes.io/part-of: paas-resilience

spec:
  replicas: 1
  selector:
    matchLabels:
      app: resilience-proxy
  template:
    metadata:
      labels:
        app: resilience-proxy
        app.kubernetes.io/part-of: paas-resilience
    spec:
      containers:
        - name: nginx-proxy
          image: nginx:alpine
          ports:
            - containerPort: 8080
              name: http

          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi

          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5

          volumeMounts:
            - name: proxy-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx.conf
              readOnly: true

      volumes:
        - name: proxy-config
          configMap:
            name: network-proxy-config
