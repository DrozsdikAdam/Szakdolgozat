apiVersion: batch/v1
kind: Job
metadata:
  name: jmeter-loadtest-job
  namespace: platform-infra
  labels:
    app: jmeter-loadtest
    app.kubernetes.io/part-of: paas-resilience

spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 0
  activeDeadlineSeconds: 600

  template:
    metadata:
      labels:
        app: jmeter-loadtest
        app.kubernetes.io/part-of: paas-resilience
    spec:
      restartPolicy: Never
      containers:
        - name: jmeter-loadtest
          image: justb4/jmeter:5.5
          command: ["/bin/bash", "/scenarios/run-test.sh"]
          args: ["$(SCENARIO)"]
          env:
            - name: SCENARIO
              value: "baseline"
            - name: TARGET_HOST
              value: "paas-portal-backend.platform-infra.svc.cluster.local"
            - name: TARGET_PORT
              value: "3000"
            - name: DURATION
              value: "60"
            - name: THREADS
              value: "10"

          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          volumeMounts:
            - name: scenarios
              mountPath: /scenarios
              readOnly: true
            - name: results
              mountPath: /results

      volumes:
        - name: scenarios
          configMap:
            name: jmeter-scenarios
            defaultMode: 0755
        - name: results
          emptyDir: {}
