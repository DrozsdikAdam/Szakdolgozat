apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: platform-infra
spec:
  type: NodePort
  selector:
    app: minio
  ports:
    - port: 9000
      name: s3-api
      targetPort: 9000
      nodePort: 30900
    - port: 9001
      name: console
      targetPort: 9001
      nodePort: 30901
