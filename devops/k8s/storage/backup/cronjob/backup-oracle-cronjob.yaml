apiVersion: batch/v1
kind: CronJob
metadata:
  name: db-backup-oracle
  namespace: platform-infra
  labels:
    app: db-backup-oracle
    app.kubernetes.io/component: backup
    app.kubernetes.io/part-of: paas-platform
spec:
  schedule: "0 2 * * *"  # Minden nap éjjel 2:00-kor fut le
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 300
      ttlSecondsAfterFinished: 60
      template:
        metadata:
          labels:
            app: db-backup-oracle
        spec:
          restartPolicy: OnFailure
          initContainers:
            - name: oracle-dump
              image: gvenzl/oracle-free:latest
              securityContext:
                runAsUser: 0
              command: ["/bin/bash", "/scripts/backup-oracle.sh"]
              env:
                - name: DB_ENGINE
                  value: "oracle"
                - name: DB_HOST
                  value: "oracle.platform-infra.svc.cluster.local"
                - name: DB_PORT
                  value: "1521"
                - name: DB_NAME
                  valueFrom:
                    secretKeyRef:
                      name: backup-secret
                      key: ORACLE_DATABASE
                - name: ORACLE_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: backup-secret
                      key: ORACLE_PASSWORD
                - name: APP_USER
                  valueFrom:
                    secretKeyRef:
                      name: backup-secret
                      key: APP_USER
              volumeMounts:
                - name: staging-volume
                  mountPath: /staging
                - name: backup-scripts
                  mountPath: /scripts
          containers:
            - name: minio-upload
              image: minio/mc:latest
              securityContext:
                runAsUser: 0
              command: ["/bin/sh", "/scripts/upload-s3.sh"]
              env:
                - name: S3_ENDPOINT
                  valueFrom:
                    secretKeyRef:
                      name: backup-secret
                      key: S3_ENDPOINT
                - name: S3_BUCKET
                  valueFrom:
                    secretKeyRef:
                      name: backup-secret
                      key: S3_BUCKET
                - name: S3_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: backup-secret
                      key: S3_ACCESS_KEY
                - name: S3_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: backup-secret
                      key: S3_SECRET_KEY
              volumeMounts:
                - name: staging-volume
                  mountPath: /staging
                - name: backup-scripts
                  mountPath: /scripts
          volumes:
            - name: staging-volume
              persistentVolumeClaim:
                claimName: backup-staging-pvc
            - name: backup-scripts
              configMap:
                name: backup-scripts
                defaultMode: 0777
