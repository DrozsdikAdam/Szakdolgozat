apiVersion: batch/v1
kind: CronJob
metadata:
  name: db-restore
  namespace: platform-infra
  labels:
    app: db-restore
    app.kubernetes.io/component: restore
    app.kubernetes.io/part-of: paas-platform
spec:
  schedule: "0 0 31 2 *"  # Manuális indításra tervezve
  suspend: true
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app: db-restore
        spec:
          restartPolicy: OnFailure
          initContainers:
            - name: minio-download
              image: minio/mc:latest
              command: ["/bin/sh", "/scripts/download-s3.sh"]
              env:
                - name: TARGET_BACKUP
                  value: "latest"
                - name: S3_ENDPOINT
                  valueFrom:
                    secretKeyRef:
                      name: backup-secret
                      key: S3_ENDPOINT
                - name: S3_BUCKET
                  valueFrom:
                    secretKeyRef:
                      name: backup-secret
                      key: S3_BUCKET
                - name: S3_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: backup-secret
                      key: S3_ACCESS_KEY
                - name: S3_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: backup-secret
                      key: S3_SECRET_KEY
              volumeMounts:
                - name: staging-volume
                  mountPath: /staging
                - name: backup-scripts
                  mountPath: /scripts
          containers:
            - name: postgres-restore
              image: bitnami/postgresql:latest
              command: ["/bin/sh", "/scripts/restore-postgres.sh"]
              env:
                - name: DB_HOST
                  valueFrom:
                    secretKeyRef:
                      name: backup-secret
                      key: DB_HOST
                - name: DB_PORT
                  valueFrom:
                    secretKeyRef:
                      name: backup-secret
                      key: DB_PORT
                - name: DB_USER
                  valueFrom:
                    secretKeyRef:
                      name: backup-secret
                      key: DB_USER
                - name: DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: backup-secret
                      key: DB_PASSWORD
                - name: DB_NAME
                  valueFrom:
                    secretKeyRef:
                      name: backup-secret
                      key: DB_NAME
                - name: DB_PRIMARY_HOST
                  value: "postgres-postgresql-primary"
              volumeMounts:
                - name: staging-volume
                  mountPath: /staging
                - name: backup-scripts
                  mountPath: /scripts
          volumes:
            - name: staging-volume
              persistentVolumeClaim:
                claimName: backup-staging-pvc
            - name: backup-scripts
              configMap:
                name: backup-scripts
                defaultMode: 0777
