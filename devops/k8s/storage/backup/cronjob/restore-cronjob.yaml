apiVersion: batch/v1
kind: CronJob
metadata:
  name: db-restore
  namespace: platform-infra
spec:
  schedule: "0 0 1 1 *"
  suspend: true
  concurrencyPolicy: "Forbid"
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 60
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: db-restore
        spec:
          initContainers:
            - name: fetch-backup
              image: minio/mc:latest
              env:
                - name: TARGET_BACKUP
                  value: "latest"
                - name: S3_ENDPOINT
                  valueFrom:
                    secretKeyRef:
                      name: backup-secret
                      key: S3_ENDPOINT
                - name: S3_BUCKET
                  valueFrom:
                    secretKeyRef:
                      name: backup-secret
                      key: S3_BUCKET
                - name: S3_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: backup-secret
                      key: S3_ACCESS_KEY
                - name: S3_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: backup-secret
                      key: S3_SECRET_KEY
              volumeMounts:
                - name: staging-volume
                  mountPath: /staging
              command: ["/bin/sh", "-c"]
              args:
                - >
                  set -e;
                  mc alias set remote $S3_ENDPOINT $S3_ACCESS_KEY $S3_SECRET_KEY;
                  if [ -n "$TARGET_BACKUP" ] && [ "$TARGET_BACKUP" != "latest" ] && mc stat remote/$S3_BUCKET/archive/$TARGET_BACKUP >/dev/null 2>&1; then
                    echo "Fetching target backup from archive: $TARGET_BACKUP";
                    mc cp remote/$S3_BUCKET/archive/$TARGET_BACKUP /staging/restore_target.sql.gz;
                  elif [ -f /staging/latest.sql.gz ]; then
                    echo "Using latest local staging backup";
                    cp /staging/latest.sql.gz /staging/restore_target.sql.gz;
                  else
                    echo "Fetching latest backup from S3 bucket";
                    mc cp remote/$S3_BUCKET/latest.sql.gz /staging/restore_target.sql.gz;
                  fi;
          containers:
            - name: postgres-restore
              image: bitnami/postgresql:latest
              env:
                - name: DB_HOST
                  valueFrom:
                    secretKeyRef:
                      name: backup-secret
                      key: DB_HOST
                - name: DB_PORT
                  valueFrom:
                    secretKeyRef:
                      name: backup-secret
                      key: DB_PORT
                - name: DB_USER
                  valueFrom:
                    secretKeyRef:
                      name: backup-secret
                      key: DB_USER
                - name: DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: backup-secret
                      key: DB_PASSWORD
                - name: DB_NAME
                  valueFrom:
                    secretKeyRef:
                      name: backup-secret
                      key: DB_NAME
                - name: DB_PRIMARY_HOST
                  valueFrom:
                    secretKeyRef:
                      name: backup-secret
                      key: DB_HOST
              volumeMounts:
                - name: staging-volume
                  mountPath: /staging
              command: ["/bin/sh", "-c"]
              args:
                - >
                  set -e;
                  gunzip -c /staging/restore_target.sql.gz | PGPASSWORD=$DB_PASSWORD psql -h $DB_PRIMARY_HOST -p $DB_PORT -U $DB_USER -d $DB_NAME;
                  PGPASSWORD=$DB_PASSWORD psql -h $DB_PRIMARY_HOST -p $DB_PORT -U $DB_USER -d $DB_NAME -c "INSERT INTO backup_catalog (filename, size_bytes, status) VALUES ('RESTORE_COMPLETED', $(stat -c%s /staging/restore_target.sql.gz), 'RESTORE_SUCCESS');";
                  echo "Database restore completed successfully.";
                  rm -f /staging/restore_target.sql.gz;
          restartPolicy: OnFailure
          volumes:
            - name: staging-volume
              persistentVolumeClaim:
                claimName: backup-staging-pvc
