apiVersion: batch/v1
kind: CronJob
metadata:
  name: db-backup
  namespace: platform-infra
  labels:
    app: db-backup
    app.kubernetes.io/component: backup
    app.kubernetes.io/part-of: paas-platform
spec:
  schedule: "0 2 * * *"  # Minden nap éjjel 2:00-kor fut le
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 300
      ttlSecondsAfterFinished: 60
      template:
        metadata:
          labels:
            app: db-backup
        spec:
          restartPolicy: OnFailure
          initContainers:
            - name: postgres-dump
              image: bitnami/postgresql:latest
              command: ["/bin/sh", "/scripts/backup-postgres.sh"]
              env:
                - name: DB_ENGINE
                  value: "postgres"
                - name: DB_HOST
                  valueFrom:
                    secretKeyRef:
                      name: backup-secret
                      key: DB_HOST
                - name: DB_PORT
                  valueFrom:
                    secretKeyRef:
                      name: backup-secret
                      key: DB_PORT
                - name: DB_USER
                  valueFrom:
                    secretKeyRef:
                      name: backup-secret
                      key: DB_USER
                - name: DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: backup-secret
                      key: DB_PASSWORD
                - name: DB_NAME
                  valueFrom:
                    secretKeyRef:
                      name: backup-secret
                      key: DB_NAME
              volumeMounts:
                - name: staging-volume
                  mountPath: /staging
                - name: backup-scripts
                  mountPath: /scripts
          containers:
            - name: minio-upload
              image: minio/mc:latest
              securityContext:
                runAsUser: 0
              command: ["/bin/sh", "/scripts/upload-s3.sh"]
              env:
                - name: S3_ENDPOINT
                  valueFrom:
                    secretKeyRef:
                      name: backup-secret
                      key: S3_ENDPOINT
                - name: S3_BUCKET
                  valueFrom:
                    secretKeyRef:
                      name: backup-secret
                      key: S3_BUCKET
                - name: S3_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: backup-secret
                      key: S3_ACCESS_KEY
                - name: S3_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: backup-secret
                      key: S3_SECRET_KEY
              volumeMounts:
                - name: staging-volume
                  mountPath: /staging
                - name: backup-scripts
                  mountPath: /scripts
          volumes:
            - name: staging-volume
              persistentVolumeClaim:
                claimName: backup-staging-pvc
            - name: backup-scripts
              configMap:
                name: backup-scripts
                defaultMode: 0777
