apiVersion: batch/v1
kind: CronJob
metadata:
  name: db-backup
  namespace: platform-infra
spec:
  # minute hour day_of_month month day_of_week
  schedule: "0 2 * * *" # every day at 2 AM
  concurrencyPolicy: "Forbid"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: db-backup
        spec:
          restartPolicy: OnFailure
          volumes:
            - name: staging-volume
              persistentVolumeClaim:
                claimName: backup-staging-pvc
          containers:
            - name: postgres-dump
              image: bitnami/postgresql:latest
              env:
                - name: DB_HOST
                  valueFrom:
                    secretKeyRef:
                      name: backup-secret-6hd2k844bt
                      key: DB_HOST
                - name: DB_PORT
                  valueFrom:
                    secretKeyRef:
                      name: backup-secret-6hd2k844bt
                      key: DB_PORT
                - name: DB_USER
                  valueFrom:
                    secretKeyRef:
                      name: backup-secret-6hd2k844bt
                      key: DB_USER
                - name: DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: backup-secret-6hd2k844bt
                      key: DB_PASSWORD
                - name: DB_NAME
                  valueFrom:
                    secretKeyRef:
                      name: backup-secret-6hd2k844bt
                      key: DB_NAME
                - name: DB_PRIMARY_HOST
                  valueFrom:
                    secretKeyRef:
                      name: backup-secret-6hd2k844bt
                      key: DB_HOST
              volumeMounts:
                - name: staging-volume
                  mountPath: /staging
              command: ["/bin/sh", "-c"]
              args:
                - >
                  set -e;
                  TIMESTAMP=$(date +%Y%m%d_%H%M%S);
                  echo "Creating backup: $TIMESTAMP";
                  PGPASSWORD=$DB_PASSWORD pg_dump -h $DB_HOST -p $DB_PORT -U $DB_USER -d $DB_NAME | gzip > /staging/backup_${TIMESTAMP}.sql.gz;
                  cp /staging/backup_${TIMESTAMP}.sql.gz /staging/latest.sql.gz;
                  PGPASSWORD=$DB_PASSWORD psql -h $DB_PRIMARY_HOST -p $DB_PORT -U $DB_USER -d $DB_NAME -c "CREATE TABLE IF NOT EXISTS backup_catalog (id SERIAL PRIMARY KEY, filename TEXT, size_bytes BIGINT, status TEXT, created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP);";
                  PGPASSWORD=$DB_PASSWORD psql -h $DB_PRIMARY_HOST -p $DB_PORT -U $DB_USER -d $DB_NAME -c "INSERT INTO backup_catalog (filename, size_bytes, status) VALUES ('backup_${TIMESTAMP}.sql.gz', $(stat -c%s /staging/backup_${TIMESTAMP}.sql.gz), 'COMPLETED');";
                  echo "Backup completed successfully:";
                  ls -lh /staging;
