apiVersion: batch/v1
kind: Job
metadata:
  name: minio-create-bucket
  namespace: platform-infra
spec:
  ttlSecondsAfterFinished: 60
  backoffLimit: 5
  template:
    metadata:
      labels:
        app: create-bucket
    spec:
      restartPolicy: OnFailure
      containers:
        - name: create-bucket
          image: minio/mc:latest
          env:
            - name: S3_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: backup-secret
                  key: S3_ENDPOINT
            - name: S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: backup-secret
                  key: S3_BUCKET
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: backup-secret
                  key: S3_ACCESS_KEY
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: backup-secret
                  key: S3_SECRET_KEY
          command: ["/bin/sh", "-c"]
          args:
            - >
              set -e;
              echo "Waiting for MinIO service...";
              until mc alias set remote "$S3_ENDPOINT" "$S3_ACCESS_KEY" "$S3_SECRET_KEY"; do
                echo "MinIO not ready yet, retrying in 3 seconds...";
                sleep 3;
              done;
              echo "Creating bucket $S3_BUCKET...";
              mc mb --ignore-existing "remote/$S3_BUCKET";
              echo "Bucket initialization complete:";
              mc ls remote;
