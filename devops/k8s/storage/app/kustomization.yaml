apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: platform-infra

secretGenerator:
  - name: app-storage-secret
    envs:
      - ../../../platform.env

generatorOptions:
  disableNameSuffixHash: true

resources:
  - app-storage-pvc.yaml
  - app-storage-service.yaml
  - app-storage-statefulset.yaml
  - app-storage-network-policy.yaml
