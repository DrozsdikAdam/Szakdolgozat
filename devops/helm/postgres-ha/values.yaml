architecture: replication

auth:
  database: mesdb
  username: mesuser
  password: mespassword
  postgresPassword: adminpassword
  replicationPassword: replpassword

primary:
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1024Mi"
      cpu: "1000m"
  persistence:
    size: 2Gi

readReplicas:
  replicaCount: 2
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  persistence:
    size: 2Gi
