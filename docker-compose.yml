services:
  redis:
    image: redis:7-alpine
    container_name: mes-redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    image: mes-backend:v5
    container_name: mes-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - ./devops/platform.env
    environment:
      - SPRING_DATASOURCE_URL=${DOCKER_SPRING_DATASOURCE_URL:-jdbc:postgresql://host.docker.internal:5432/mes_db}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD:-VnUH22Refo}
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:-org.postgresql.Driver}
      - SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT=${SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT:-org.hibernate.dialect.PostgreSQLDialect}
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_MAIL_HOST=mailpit
      - SPRING_MAIL_PORT=1025
      - FRONTEND_RESET_PASSWORD_URL=http://localhost:3005/reset-password
      - CORS_ALLOWED_ORIGINS=http://localhost:3005,http://localhost:5173,http://localhost:8085,http://localhost:8088
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_started
      mailpit:
        condition: service_started

  frontend:
    image: mes-frontend:v4
    container_name: mes-frontend
    restart: unless-stopped
    ports:
      - "3005:8080"
    depends_on:
      - backend

  mailpit:
    image: axllent/mailpit
    container_name: mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
