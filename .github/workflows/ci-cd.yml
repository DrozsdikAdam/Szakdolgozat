name: "CI/CD Pipeline"
on:
  pull_request:
    paths-ignore:
      - "*.md"
      - "docs/**"
      - "scripts/**"
      - ".idea/**"
      - "*.swp"

  push:
    branches:
      - "main"
      - "develop"
    paths-ignore:
      - "*.md"
      - "docs/**"
      - "scripts/**"
      - ".idea/**"
      - "*.swp"

  workflow_dispatch:

jobs:
  test-backend:
    name: "Backend Unit & Integration Tests"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Run Backend Tests"
        uses: ./devops/ci/actions/backend-test

  test-frontend:
    name: "Frontend Tests & Type Check"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Run Frontend Tests"
        uses: ./devops/ci/actions/frontend-test

  build-and-push:
    name: "Build Docker Containers"
    runs-on: "ubuntu-latest"
    needs: [test-backend, test-frontend]
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Build All Container Images"
        uses: ./devops/ci/actions/docker-build
