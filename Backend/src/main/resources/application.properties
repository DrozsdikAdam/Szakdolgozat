spring.application.name=Backend
server.port=8080

# Database settings
spring.datasource.url=jdbc:postgresql://localhost:5432/mes_db
spring.datasource.username=postgres
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Redis settings
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Liquibase database migration settings
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# Password hashing (BCrypt)
spring.security.bcrypt.strength=12

# JWT Security settings (1 day)
jwt.secret=long-secret-key-must-be-at-least-256-bits-long-for-production
jwt.expiration=86400000

# Spring Boot Actuator & Prometheus metrics
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.metrics.tags.application=${spring.application.name}

# Resilience4j Circuit Breaker settings
resilience4j.circuitbreaker.instances.dbCall.sliding-window-size=10
resilience4j.circuitbreaker.instances.dbCall.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.dbCall.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.dbCall.permitted-number-of-calls-in-half-open-state=3

# Bucket4j Rate Limiting settings
bucket4j.enabled=false
bucket4j.filters[0].name=api-rate-limit-filter
bucket4j.filters[0].url=/api/.*
bucket4j.filters[0].rate-limits[0].bandwidths[0].capacity=60
bucket4j.filters[0].rate-limits[0].bandwidths[0].time=1
bucket4j.filters[0].rate-limits[0].bandwidths[0].unit=minutes