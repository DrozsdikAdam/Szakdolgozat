spring.application.name=Backend
server.port=8080

# Database settings
spring.datasource.url=jdbc:postgresql://localhost:5432/mes_db
spring.datasource.username=postgres
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Redis settings
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Liquibase database migration settings
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# JWT Security settings (1 day)
jwt.secret=long-secret-key-must-be-at-least-256-bits-long-for-production
jwt.expiration=86400000

# Spring Boot Actuator & Prometheus metrics
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.metrics.tags.application=${spring.application.name}

# Resilience4j Circuit Breaker settings
resilience4j.circuitbreaker.instances.dbCall.sliding-window-size=10
resilience4j.circuitbreaker.instances.dbCall.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.dbCall.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.dbCall.permitted-number-of-calls-in-half-open-state=3

# Bucket4j Rate Limiting settings
bucket4j.enabled=true
bucket4j.filters[1].cache-name=api-rate-limit-filter
bucket4j.filters[1].url=/api/.*
bucket4j.filters[1].filter-order=2
bucket4j.filters[1].rate-limits[0].cache-key=getRemoteAddr()
bucket4j.filters[1].rate-limits[0].bandwidths[0].capacity=100
bucket4j.filters[1].rate-limits[0].bandwidths[0].time=1
bucket4j.filters[1].rate-limits[0].bandwidths[0].unit=minutes
bucket4j.filters[1].http-response-body={ "status": 429, "error": "Too Many Requests", "message": "Túl sok kérés érkezett a szerverre! Kérjük, várjon egy percet." }
bucket4j.filters[1].http-response-headers[Content-Type]=application/json;charset=UTF-8

bucket4j.filters[0].cache-name=api-rate-limit-filter
bucket4j.filters[0].url=/api/auth/login
bucket4j.filters[0].rate-limits[0].cache-key=getRemoteAddr()
bucket4j.filters[0].filter-order=1
bucket4j.filters[0].rate-limits[0].bandwidths[0].capacity=10
bucket4j.filters[0].rate-limits[0].bandwidths[0].time=1
bucket4j.filters[0].rate-limits[0].bandwidths[0].unit=minutes
bucket4j.filters[0].http-response-body={ "status": 429, "error": "Too Many Requests", "message": "Túl sok bejelentkezési kísérlet! Kérjük, próbálja újra egy perc múlva." }
bucket4j.filters[0].http-response-headers[Content-Type]=application/json;charset=UTF-8