# Teszt adatbázis beállítások (H2 memóriabeli adatbázis PostgreSQL kompatibilis módban)
spring.datasource.url=jdbc:h2:mem:mes_test_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate sémakezelés a tesztek alatt
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Liquibase kikapcsolása a tesztek futásakor
spring.liquibase.enabled=false

# Redis beállítások
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.repositories.enabled=false

# JWT biztonsági beállítások
jwt.secret=long-secret-key-must-be-at-least-256-bits-long-for-production
jwt.expiration=86400000

# E-mail és Alkalmazás teszt beállítások
spring.mail.host=localhost
spring.mail.port=1025
app.frontend.reset-password-url=http://localhost:5173/reset-password
app.auth.reset-token-expiration-minutes=15
